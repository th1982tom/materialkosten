remove_material:
  name: Material-Stammdaten löschen
  fields:
    material_id: {required: true, selector: {text: {}}}

add_work:
  name: Arbeitszeit erfassen
  fields:
    project_id: {required: true, selector: {text: {}}}
    date: {selector: {date: {}}}
