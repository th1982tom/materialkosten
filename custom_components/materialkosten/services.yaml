add_project:
  name: Projekt anlegen
  fields:
    name: {required: true, selector: {text: {}}}
    customer: {selector: {text: {}}}
    note: {selector: {text: {}}}
    order_number: {selector: {text: {}}}
    status:
      default: offen
      selector:
        select:
          options:
            - offen
            - in_bearbeitung
            - abgeschlossen
update_project:
  name: Auftrag bearbeiten
  description: Ändert nur die angegebenen Textfelder. Positionen, Status und Zeitstempel bleiben erhalten.
  fields:
    project_id: {required: true, selector: {text: {}}}
    name: {name: Auftragsname, selector: {text: {}}}
    customer: {name: Kunde, selector: {text: {}}}
    order_number: {name: Auftragsnummer, selector: {text: {}}}
    note: {name: Notiz, selector: {text: {multiline: true}}}
remove_project:
  name: Projekt löschen
  fields:
    project_id: {required: true, selector: {text: {}}}
add_item:
  name: Material erfassen
  fields:
    project_id: {required: true, selector: {text: {}}}
    material: {required: true, selector: {text: {}}}
    quantity: {required: true, selector: {number: {min: 0.001, mode: box}}}
    unit: {required: true, selector: {text: {}}}
    unit_price:
      name: Einzelpreis
      description: Optional. Ohne Preis wird die Position mit 0 Euro gebucht.
      default: 0
      selector: {number: {min: 0, mode: box, step: 0.01}}
    note: {selector: {text: {}}}
    save_to_catalog:
      name: Auch in den Materialstamm übernehmen
      description: Legt bei Bedarf einen Materialstammeintrag mit diesem Namen, dieser Einheit und diesem Preis an.
      default: false
      selector: {boolean: {}}
update_item:
  name: Gebuchtes Material bearbeiten
  description: Ändert nur die angegebenen Positionsfelder. Auftrag und Materialstamm bleiben erhalten.
  fields:
    item_id: {required: true, selector: {text: {}}}
    material: {name: Materialname, selector: {text: {}}}
    quantity: {name: Menge, selector: {number: {min: 0.001, mode: box, step: 0.001}}}
    unit: {name: Einheit, selector: {text: {}}}
    unit_price: {name: Einzelpreis, selector: {number: {min: 0, mode: box, step: 0.01}}}
    note: {name: Notiz, selector: {text: {multiline: true}}}
remove_item:
  name: Materialposition löschen
  fields:
    item_id: {required: true, selector: {text: {}}}
add_material:
  name: Material-Stammdaten anlegen
  fields:
    name: {required: true, selector: {text: {}}}
    unit: {selector: {text: {}}}
    unit_price: {selector: {number: {min: 0, mode: box, step: 0.01}}}
remove_material:
  name: Material-Stammdaten löschen
  fields:
    material_id: {required: true, selector: {text: {}}}

add_work:
  name: Arbeitszeit erfassen
  fields:
    project_id: {required: true, selector: {text: {}}}
    date: {selector: {date: {}}}
    description: {required: true, selector: {text: {}}}
    hours: {required: true, selector: {number: {min: 0.01, mode: box, step: 0.25}}}
    hourly_rate: {required: true, selector: {number: {min: 0, mode: box, step: 0.50}}}

update_work:
  name: Gebuchte Arbeitszeit bearbeiten
  description: Ändert nur die angegebenen Positionsfelder. Der zugehörige Auftrag bleibt erhalten.
  fields:
    work_id: {required: true, selector: {text: {}}}
    date: {name: Datum, selector: {date: {}}}
    description: {name: Tätigkeit, selector: {text: {}}}
    hours: {name: Stunden, selector: {number: {min: 0.01, mode: box, step: 0.01}}}
    hourly_rate: {name: Stundensatz, selector: {number: {min: 0, mode: box, step: 0.01}}}
remove_work:
  name: Arbeitszeit löschen
  fields:
    work_id: {required: true, selector: {text: {}}}

update_project_status:
  name: Auftragsstatus ändern
  fields:
    project_id: {required: true, selector: {text: {}}}
    status:
      required: true
      selector:
        select:
          options:
            - offen
            - in_bearbeitung
            - abgeschlossen
